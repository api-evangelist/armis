openapi: 3.2.0
info:
  title: Armis API v3 Authentication API
  version: 0.13.0
  description: Manage authentication of the API.
servers:
- url: https://api.armis.com/v3
tags:
- name: Authentication
  description: Manage authentication of the API.
paths:
  /oauth/token:
    post:
      tags:
      - Authentication
      summary: Create an access token for consuming the API
      description: 'Use this endpoint to create an access token.


        You then authorize calls to the other endpoints by adding the header: "Authorization: Bearer ".'
      operationId: post_oauth_token_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    AuthRequest:
      properties:
        audience:
          type: string
          title: Audience
          description: Value has to be the full tenant's domain with scheme and trailing slash
          examples:
          - https://acme.armis.com/
        grant_type:
          type: string
          const: client_credentials
          title: Grant Type
        client_id:
          type: string
          title: Client Id
          description: Use email of the user that created the 'client_secret'
        client_secret:
          type: string
          title: Client Secret
          description: To obtain the secret, go to https://<tenant>.armis.com/settings/api-management
        vendor_id:
          type: string
          title: Vendor Id
          description: The Vendor ID you received upon singing up to the developer portal
        scopes:
          items:
            type: string
            enum:
            - FULL_VISIBILITY
            - PERMISSION.ALERT.READ
            - PERMISSION.DEVICE.MANAGE
            - PERMISSION.DEVICE.MANAGE.EDIT
            - PERMISSION.DEVICE.READ
            - PERMISSION.PII.DEVICE
            - PERMISSION.POLICY.READ
            - PERMISSION.REPORT.MANAGE.CREATE
            - PERMISSION.REPORT.MANAGE.DELETE
            - PERMISSION.REPORT.READ
            - PERMISSION.SETTINGS.BOUNDARY.MANAGE.CREATE
            - PERMISSION.SETTINGS.BOUNDARY.MANAGE.DELETE
            - PERMISSION.SETTINGS.BOUNDARY.MANAGE.EDIT
            - PERMISSION.SETTINGS.BOUNDARY.READ
            - PERMISSION.SETTINGS.COLLECTOR.READ
            - PERMISSION.SETTINGS.CUSTOM_PROPERTIES.MANAGE
            - PERMISSION.SETTINGS.CUSTOM_PROPERTIES.READ
            - PERMISSION.SETTINGS.INTEGRATION.MANAGE
            - PERMISSION.SETTINGS.INTEGRATION.READ
            - PERMISSION.SETTINGS.SITES_AND_SENSORS.MANAGE.SITES
            - PERMISSION.SETTINGS.SITES_AND_SENSORS.READ
            - PERMISSION.VMDR
            - PERMISSION.VMDR.READ
          type: array
          title: Scopes
          description: A list of scopes to grant access to
          examples:
          - - PERMISSION.DEVICE.READ
            - PERMISSION.REPORT.READ
      type: object
      required:
      - audience
      - grant_type
      - client_id
      - client_secret
      - vendor_id
      title: AuthRequest
      examples:
      - audience: https://acme.armis.com/
        client_id: foo@acme.com
        client_secret: 4b8d7e47f49e6bbfffc3d681a08062f42bd46d08b851c23081891338b83ed8cb
        grant_type: client_credentials
        scopes:
        - PERMISSION.DEVICE.READ
        - PERMISSION.REPORT.READ
        vendor_id: my-vendor-id
    AuthResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          const: Bearer
          title: Token Type
        expires_in:
          type: integer
          title: Expires In
          description: Expiration time in seconds
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      title: AuthResponse
      examples:
      - access_token: 8fad727f618d916e7750ba18721dea21d9d5a0fe3c3f3711ac86c2207bb13c9a
        expires_in: 900
        token_type: Bearer
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-Armis-Client-Name
