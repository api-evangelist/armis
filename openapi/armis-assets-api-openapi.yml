openapi: 3.2.0
info:
  title: Armis API v3 Assets API
  version: 0.13.0
servers:
- url: https://api.armis.com/v3
tags:
- name: Assets
paths:
  /assets/_bulk:
    post:
      tags:
      - Assets
      summary: Update assets in bulk
      description: '### Required scopes:

        * `PERMISSION.DEVICE.MANAGE.EDIT`'
      operationId: post_assets__bulk_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkRequest'
        required: true
      responses:
        '207':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
  /assets/_search:
    post:
      tags:
      - Assets
      summary: Search assets that match a certain criteria
      description: '### Required scopes:

        * `PERMISSION.DEVICE.READ`

        * `PERMISSION.PII.DEVICE`

        * `FULL_VISIBILITY`'
      operationId: search_assets__search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchAssetsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAssetsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
  /assets/_search/fields:
    get:
      tags:
      - Assets
      summary: List allowed fields
      description: 'List the values that are valid in the `POST /assets/_search` endpoint''s `field` parameter.


        Includes:

        * Common Armis fields.

        * Custom fields (also reflected in the `GET /settings/device-custom-properties` endpoint).

        * Integration fields.'
      operationId: fields_assets__search_fields_get
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: asset_type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AssetType'
          default: DEVICE
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchFieldsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    BulkItemResponse:
      properties:
        status:
          type: integer
          title: Status
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - status
      title: BulkItemResponse
      examples:
      - status: 200
      - error: Bad Request
        status: 400
    FieldDescription:
      properties:
        name:
          anyOf:
          - $ref: '#/components/schemas/AssetField'
          - $ref: '#/components/schemas/CustomPropertyField-Output'
          - $ref: '#/components/schemas/IntegrationPropertyField-Output'
          title: Name
        type:
          $ref: '#/components/schemas/FieldType'
          default: string
        is_list:
          type: boolean
          title: Is List
          default: false
      type: object
      required:
      - name
      title: FieldDescription
      examples:
      - is_list: true
        name: boundaries
        type: object
      - is_list: false
        name: brand
        type: string
      - is_list: false
        name: device_id
        type: integer
      - is_list: false
        name: first_seen
        type: timestamp
      - is_list: true
        name: ipv4_addresses
        type: ipv4
      - is_list: false
        name: custom.custom1
        type: string
      - is_list: false
        name: integration.gcp_image
        type: string
    BulkItemUnsetRequest:
      properties:
        asset_id:
          anyOf:
          - type: integer
          - type: string
          title: Asset Id
          description: 'The identifier that will be used to find the asset that needs to be updated.


            The content type will vary according to the selected `asset_id_source` field (e.g. IP v4, Asset ID, etc.).


            Generally speaking, all identifiers except Asset ID are provided by the customer''s environment.'
          examples:
          - 8.8.8.8
          - 1234
        operation:
          type: string
          const: UNSET
          title: Operation
        key:
          type: string
          title: Key
          description: 'The key of the asset you wish to update.

            * Currently, only custom properties are supported.

            * For custom properties, add the `custom.` prefix. (e.g. `custom.MY_CUSTOM_PROPERTY`).

            * To see the available custom properties, please refer to the [List all device custom property configurations](/reference/get_settings_device_custom_properties_get#/) endpoint.'
          examples:
          - custom.MY_CUSTOM_PROPERTY
      type: object
      required:
      - asset_id
      - operation
      - key
      title: BulkItemUnsetRequest
      examples:
      - asset_id: 1
        key: custom.Size
        operation: UNSET
      - asset_id: 1.2.3.4
        key: custom.Size
        operation: UNSET
      - asset_id: ::ffff:1.2.3.4
        key: custom.Size
        operation: UNSET
      - asset_id: aa:bb:cc:dd:ee:ff
        key: custom.Size
        operation: UNSET
      - asset_id: ABCDEF
        key: custom.Size
        operation: UNSET
    AssetIdSource:
      type: string
      enum:
      - ASSET_ID
      - IPV4_ADDRESS
      - IPV6_ADDRESS
      - MAC_ADDRESS
      - SERIAL_NUMBER
      title: AssetIdSource
    AssetResponse:
      properties:
        asset_id:
          anyOf:
          - type: integer
          - type: string
          title: Asset Id
        fields:
          type: object
          title: Fields
      type: object
      required:
      - asset_id
      - fields
      title: AssetResponse
    CustomPropertyField-Input:
      type: string
      pattern: ^custom\..+$
      title: CustomPropertyField
      description: 'This model represents a device custom property field.

        It makes sure that it has a prefix "custom."'
    BulkItemSetRequest:
      properties:
        asset_id:
          anyOf:
          - type: integer
          - type: string
          title: Asset Id
          description: 'The identifier that will be used to find the asset that needs to be updated.


            The content type will vary according to the selected `asset_id_source` field (e.g. IP v4, Asset ID, etc.).


            Generally speaking, all identifiers except Asset ID are provided by the customer''s environment.'
          examples:
          - 8.8.8.8
          - 1234
        operation:
          type: string
          const: SET
          title: Operation
        key:
          type: string
          title: Key
          description: 'The key of the asset you wish to update.

            * Currently, only custom properties are supported.

            * For custom properties, add the `custom.` prefix. (e.g. `custom.MY_CUSTOM_PROPERTY`).

            * To see the available custom properties, please refer to the [List all device custom property configurations](/reference/get_settings_device_custom_properties_get#/) endpoint.'
          examples:
          - custom.MY_CUSTOM_PROPERTY
        value:
          title: Value
      type: object
      required:
      - asset_id
      - operation
      - key
      title: BulkItemSetRequest
      examples:
      - asset_id: 1
        key: custom.Size
        operation: SET
        value: small
      - asset_id: 1.2.3.4
        key: custom.Size
        operation: SET
        value: small
      - asset_id: ::ffff:1.2.3.4
        key: custom.Size
        operation: SET
        value: small
      - asset_id: aa:bb:cc:dd:ee:ff
        key: custom.Size
        operation: SET
        value: small
      - asset_id: ABCDEF
        key: custom.Size
        operation: SET
        value: small
    IntegrationPropertyField-Input:
      type: string
      pattern: ^integration\..+$
      title: IntegrationPropertyField
      description: 'This model represents a device integration property field.

        It makes sure that it has a prefix "integration.<something>."'
