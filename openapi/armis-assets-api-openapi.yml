      title: DeviceType
    AssetType:
      type: string
      enum:
      - DEVICE
      title: AssetType
    FilterByType:
      properties:
        operator:
          anyOf:
          - $ref: '#/components/schemas/EqualityOperator'
          - type: 'null'
        filter_criteria:
          type: string
          const: TYPE
          title: Filter Criteria
          default: TYPE
        types:
          items:
            $ref: '#/components/schemas/DeviceType'
          type: array
          maxItems: 1000
          minItems: 1
          title: Types
        after:
          type: integer
          minimum: 0
          title: After
          description: Cursor for pagination
          default: 0
        limit:
          type: integer
          maximum: 1000
          minimum: 1
          title: Limit
          description: Number of items to return
          default: 10
      type: object
      required:
      - types
      title: FilterByType
      examples:
      - filter_criteria: TYPE
        types:
        - Mobile Phones
      - filter_criteria: TYPE
        operator: NOT_EQUALS
        types:
        - Mobile Phones
      - after: 100
        filter_criteria: TYPE
        limit: 50
        types:
        - Mobile Phones
    BulkRequest:
      properties:
        asset_type:
          $ref: '#/components/schemas/AssetType'
          default: DEVICE
        asset_id_source:
          $ref: '#/components/schemas/AssetIdSource'
          description: 'Some assets may have multiple unique identifiers.


            For example, a device can have an Asset ID, a MAC Address, an IPv4, etc.


            This field determines which field will be used to find the asset.'
          default: ASSET_ID
        items:
          items:
            oneOf:
            - $ref: '#/components/schemas/BulkItemSetRequest'
            - $ref: '#/components/schemas/BulkItemUnsetRequest'
            discriminator:
              propertyName: operation
              mapping:
                SET: '#/components/schemas/BulkItemSetRequest'
                UNSET: '#/components/schemas/BulkItemUnsetRequest'
          type: array
          maxItems: 1000
          title: Items
      type: object
      required:
      - items
      title: BulkRequest
      examples:
      - items:
        - asset_id: 1
          key: custom.Size
          operation: SET
          value: small
        - asset_id: 2
          key: custom.Size
          operation: UNSET
      - asset_id_source: ASSET_ID
        asset_type: DEVICE
        items:
        - asset_id: 1
          key: custom.Size
          operation: SET
          value: small
        - asset_id: 2
          key: custom.Size
          operation: UNSET
      - asset_id_source: IPV4_ADDRESS
        asset_type: DEVICE
        items:
        - asset_id: 1.2.3.4
          key: custom.Size
          operation: SET
          value: small
      - asset_id_source: IPV6_ADDRESS
        asset_type: DEVICE
        items:
        - asset_id: ::ffff:1.2.3.4
          key: custom.Size
          operation: SET
          value: small
      - asset_id_source: MAC_ADDRESS
        asset_type: DEVICE
        items:
        - asset_id: aa:bb:cc:dd:ee:ff
          key: custom.Size
          operation: SET
          value: small
      - asset_id_source: SERIAL_NUMBER
        asset_type: DEVICE
        items:
        - asset_id: ABCDEF
          key: custom.Size
          operation: SET
          value: small
    FilterByName:
      properties:
        operator:
          anyOf:
          - $ref: '#/components/schemas/EqualityOperator'
          - type: 'null'
        filter_criteria:
          type: string
          const: NAME
          title: Filter Criteria
          default: NAME
        names:
          items:
            type: string
          type: array
          maxItems: 1000
          minItems: 1
          title: Names
        after:
          type: integer
          minimum: 0
          title: After
          description: Cursor for pagination
          default: 0
        limit:
          type: integer
          maximum: 1000
          minimum: 1
          title: Limit
          description: Number of items to return
          default: 10
      type: object
      required:
      - names
      title: FilterByName
      examples:
      - filter_criteria: NAME
        names:
        - my-device
      - filter_criteria: NAME
        names:
        - my-device
        operator: NOT_EQUALS
      - after: 100
        filter_criteria: NAME
        limit: 50
        names:
        - my-device
        - other-device
    FilterByLastSeen:
      properties:
        filter_criteria:
          type: string
          const: LAST_SEEN
          title: Filter Criteria
          default: LAST_SEEN
        last_seen_ge:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Seen Ge
          description: Last seen after (or exactly on) this date (in UTC).
        last_seen_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          title: Last Seen Seconds
          description: Last seen in the last X seconds.
        after:
          type: integer
          minimum: 0
          title: After
          description: Cursor for pagination
          default: 0
        limit:
          type: integer
          maximum: 1000
          minimum: 1
          title: Limit
          description: Number of items to return
          default: 10
      type: object
      title: FilterByLastSeen
      examples:
      - filter_criteria: LAST_SEEN
        last_seen_ge: '2025-09-01'
      - filter_criteria: LAST_SEEN
        last_seen_seconds: 3600
      - after: 250
        filter_criteria: LAST_SEEN
        last_seen_ge: '2025-09-01'
        limit: 50
    FilterByBoundaryId:
      properties:
        operator:
          anyOf:
          - $ref: '#/components/schemas/EqualityOperator'
          - type: 'null'
        filter_criteria:
          type: string
          const: BOUNDARY_ID
          title: Filter Criteria
          default: BOUNDARY_ID
        boundary_ids:
          items:
            anyOf:
            - type: integer
            - type: 'null'
          type: array
          maxItems: 1000
          minItems: 1
          title: Boundary Ids
        after:
          type: integer
          minimum: 0
          title: After
          description: Cursor for pagination
          default: 0
        limit:
          type: integer
          maximum: 1000
          minimum: 1
          title: Limit
          description: Number of items to return
          default: 10
      type: object
      required:
      - boundary_ids
      title: FilterByBoundaryId
      examples:
      - boundary_ids:
        - 1
        - 2
        - 3
        filter_criteria: BOUNDARY_ID
      - boundary_ids:
        - 1
        - 2
        - 3
        filter_criteria: BOUNDARY_ID
        operator: NOT_EQUALS
      - after: 250
        boundary_ids:
        - 1
        - 2
        - 3
        filter_criteria: BOUNDARY_ID
        limit: 50
      - boundary_ids:
        - null
        filter_criteria: BOUNDARY_ID
    SearchAssetsResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AssetResponse'
          type: array
          title: Items
        next:
          anyOf:
          - type: integer
          - type: 'null'
          title: Next
      type: object
      required:
      - items
      title: SearchAssetsResponse
      examples:
      - items:
        - asset_id: 1
          fields:
            brand: Apple
            custom.custom1: My Custom Value
            device_id: 1
            tags:
            - Tag1
            - Tag2
            - Tag3
        - asset_id: 2
          fields:
            brand: Samsung
            custom.custom1: My Other Custom Value
            device_id: 3
            tags:
            - Tag4
            - Tag5
            - Tag6
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    SearchFieldsResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/FieldDescription'
          type: array
          title: Items
      type: object
      required:
      - items
      title: SearchFieldsResponse
      examples:
      - items:
        - is_list: true
          name: boundaries
          type: object
        - is_list: false
          name: brand
          type: string
        - is_list: false
          name: category
          type: string
        - is_list: false
          name: device_id
          type: integer
        - is_list: false
          name: display
          type: string
        - is_list: false
          name: first_seen
          type: timestamp
        - is_list: true
          name: ipv4_addresses
          type: ipv4
        - is_list: true
          name: ipv6_addresses
          type: ipv6
        - is_list: false
          name: last_seen
          type: timestamp
        - is_list: true
          name: mac_addresses
          type: macAddress
        - is_list: false
          name: model
          type: string
        - is_list: true
          name: names
          type: string
        - is_list: true
          name: network_interfaces
          type: object
        - is_list: false
          name: os_name
          type: string
        - is_list: false
          name: os_version
          type: string
        - is_list: false
          name: purdue_level
          type: float
        - is_list: false
          name: risk_level
          type: integer
        - is_list: true
          name: serial_numbers
          type: string
        - is_list: false
          name: site
          type: object
        - is_list: true
          name: tags
          type: string
        - is_list: false
          name: type
          type: string
        - is_list: false
          name: visibility
          type: string
        - is_list: false
          name: custom.custom1
          type: string
        - is_list: false
          name: integration.gcp_image
          type: string
    SearchAssetsRequest:
      properties:
        asset_type:
          $ref: '#/components/schemas/AssetType'
          default: DEVICE
        fields:
          items:
            anyOf:
            - $ref: '#/components/schemas/AssetField'
            - $ref: '#/components/schemas/CustomPropertyField-Input'
            - $ref: '#/components/schemas/IntegrationPropertyField-Input'
          type: array
          title: Fields
        filter:
          oneOf:
          - $ref: '#/components/schemas/FilterByAssetId'
          - $ref: '#/components/schemas/FilterByBoundaryId'
          - $ref: '#/components/schemas/FilterByBrand'
          - $ref: '#/components/schemas/FilterByCategory'
          - $ref: '#/components/schemas/FilterByLastSeen'
          - $ref: '#/components/schemas/FilterByName'
          - $ref: '#/components/schemas/FilterBySiteId'
          - $ref: '#/components/schemas/FilterByTag'
          - $ref: '#/components/schemas/FilterByType'
          - $ref: '#/components/schemas/FilterByVisibility'
          - $ref: '#/components/schemas/FilterByMultiple'
          title: Filter
          discriminator:
            propertyName: filter_criteria
            mapping:
              ASSET_ID: '#/components/schemas/FilterByAssetId'
              BOUNDARY_ID: '#/components/schemas/FilterByBoundaryId'
              BRAND: '#/components/schemas/FilterByBrand'
              CATEGORY: '#/components/schemas/FilterByCategory'
              LAST_SEEN: '#/components/schemas/FilterByLastSeen'
              MULTIPLE: '#/components/schemas/FilterByMultiple'
              NAME: '#/components/schemas/FilterByName'
              SITE_ID: '#/components/schemas/FilterBySiteId'
              TAG: '#/components/schemas/FilterByTag'
              TYPE: '#/components/schemas/FilterByType'
              VISIBILITY: '#/components/schemas/FilterByVisibility'
      type: object
      required:
      - fields
      - filter
      title: SearchAssetsRequest
      examples:
      - asset_type: DEVICE
        fields:
        - device_id
        - brand
        - tags
        - custom.custom1
        filter:
          asset_ids:
          - 1
          filter_criteria: ASSET_ID
      - asset_type: DEVICE
        fields:
