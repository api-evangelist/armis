openapi: 3.2.0
info:
  title: Armis API v3 Integrations API
  version: 0.13.0
servers:
- url: https://api.armis.com/v3
tags:
- name: Integrations
paths:
  /settings/integrations:
    get:
      tags:
      - Integrations
      summary: List integrations
      description: '### Required scopes:

        * `PERMISSION.SETTINGS.INTEGRATION.READ`'
      operationId: get_settings_integrations_get
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: After
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersistentIntegrationItems'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Integrations
      summary: Create a new integration
      description: '### Required scopes:

        * `PERMISSION.SETTINGS.INTEGRATION.MANAGE`'
      operationId: post_settings_integrations_post
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersistentIntegration'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /settings/integrations/_search:
    post:
      tags:
      - Integrations
      summary: Search integrations that match a certain criteria
      description: '### Required scopes:

        * `PERMISSION.SETTINGS.INTEGRATION.READ`'
      operationId: search_settings_integrations__search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationSearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersistentIntegrationItems'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
  /settings/integrations/{integration_id}:
    get:
      tags:
      - Integrations
      summary: Get an integration
      description: '### Required scopes:

        * `PERMISSION.SETTINGS.INTEGRATION.READ`'
      operationId: get_settings_integrations__integration_id__get
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: integer
          title: Integration Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersistentIntegration'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Integrations
      summary: Delete an integration
      description: '### Required scopes:

        * `PERMISSION.SETTINGS.INTEGRATION.MANAGE`'
      operationId: delete_settings_integrations__integration_id__delete
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: integer
          title: Integration Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Integrations
      summary: Update an integration
      description: '### Required scopes:

        * `PERMISSION.SETTINGS.INTEGRATION.MANAGE`'
      operationId: patch_settings_integrations__integration_id__patch
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: integration_id
        in: path
        required: true
        schema:
          type: integer
          title: Integration Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersistentIntegration'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    IntegrationSearchFilter:
      properties:
        ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Ids
          description: Filter by integration IDs
        names:
          anyOf:
          - items:
              $ref: '#/components/schemas/IntegrationName'
            type: array
          - type: 'null'
          title: Names
          description: Filter by integration display name (e.g., 'Cisco Meraki', 'Network Mapper')
        states:
          anyOf:
          - items:
              $ref: '#/components/schemas/IntegrationState'
            type: array
          - type: 'null'
          title: States
          description: Filter by integration state
        collector_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Collector Ids
          description: Filter by associated collector IDs
        broker_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Broker Ids
          description: Filter by associated broker IDs
      type: object
      title: IntegrationSearchFilter
    IntegrationCreateRequest:
      properties:
        name:
          $ref: '#/components/schemas/IntegrationName'
          description: The integration display name (e.g., 'CrowdStrike', 'Network Mapper')
        instance_name:
          type: string
          minLength: 1
          title: Instance Name
          description: The integration instance name
        params:
          type: object
          title: Params
          description: Integration parameters
        state:
          $ref: '#/components/schemas/IntegrationState'
          description: The integration state
          default: ACTIVE
        collector_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Collector Id
          description: The ID of the collector associated with this integration
        broker_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Broker Id
          description: The ID of the broker associated with this integration
      type: object
      required:
      - name
      - instance_name
      - params
      title: IntegrationCreateRequest
      examples:
      - collector_id: 10
        instance_name: Network-Mapper-HQ
        name: Network Mapper
        params:
          crawler_device_enrichment: true
          ip_list: 10.199.0.10, 10.199.0.2
          mapper_query_method: snmp
          mapper_snmp_credentials: '***'
          scope: all_nodes
          site_scope:
            enabled: false
    IntegrationState:
      type: string
      enum:
      - ACTIVE
      - DRAFT
      - INACTIVE
      title: IntegrationState
    IntegrationCycleStatistics:
      properties:
        entity_type:
          type: string
          title: Entity Type
          description: The entity type synced in the cycle
        post_filter_amount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Post Filter Amount
          description: Amount of records after filtering
        sent_to_armis_amount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sent To Armis Amount
          description: Amount of records sent to Armis
        unique_armis_records_amount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Unique Armis Records Amount
          description: Amount of unique Armis records
      type: object
      required:
      - entity_type
      title: IntegrationCycleStatistics
    PersistentIntegrationItems:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PersistentIntegration'
          type: array
          title: Items
        next:
          anyOf:
          - type: string
          - type: 'null'
          title: Next
      type: object
      required:
      - items
      title: PersistentIntegrationItems
      examples:
      - items:
        - creation_time: '2026-06-17T10:34:17.418146Z'
          current_state: IDLE
          id: 73902
          instance_name: new central
          name: Aruba New Central
          params:
            aruba_new_central_base_url: de1.api.central.arubanetworks.com
            aruba_new_central_client_id: 8cd0c007-0956-4f19-b648-343a5156c0a3
            aruba_new_central_client_secret: '********'
            integration_schedule:
              crontab: 0 */8 * * *
          params_change_time: '2026-06-17T10:35:43.531745Z'
          state: ACTIVE
          statistics:
            cycle_statistics:
            - entity_type: Access Points
              post_filter_amount: 2
              sent_to_armis_amount: 2
              unique_armis_records_amount: 2
            - entity_type: Switches
              post_filter_amount: 1
              sent_to_armis_amount: 1
              unique_armis_records_amount: 1
            last_successful_cycle_ended: '2026-06-24T07:23:04.342905Z'
            status: ACTIVE
            status_changed_at: '2026-06-24T07:23:07.680339Z'
            status_created_at: '2026-06-17T10:34:17.447885Z'
        next: NzM0MzI=
    IntegrationStatistics:
      properties:
        status:
          anyOf:
          - $ref: '#/components/schemas/IntegrationStatus'
          - type: 'null'
          description: The integration status
        error_details:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Details
          description: Raw error details of the last run
        last_successful_cycle_ended:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Successful Cycle Ended
          description: When the last successful cycle ended
        status_created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Status Created At
          description: When the status was first reported
        status_changed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Status Changed At
          description: When the status last changed
        cycle_statistics:
          anyOf:
          - items:
              $ref: '#/components/schemas/IntegrationCycleStatistics'
            type: array
          - type: 'null'
          title: Cycle Statistics
          description: Per-entity-type statistics of the last cycle
      type: object
      title: IntegrationStatistics
    HealthState:
      type: string
      enum:
      - IDLE
      - INITIALIZING
      - RUNNING
      - SYNCING_CHANGES
      - WAITING_FOR_COLLECTOR
      title: HealthState
    IntegrationUpdateRequest:
      properties:
        instance_name:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Instance Name
          description: The integration instance name
        params:
          anyOf:
          - type: object
          - type: 'null'
          title: Params
          description: Integration parameters
        state:
          anyOf:
          - $ref: '#/components/schemas/IntegrationState'
          - type: 'null'
          description: The integration state
        collector_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Collector Id
          description: The ID of the collector associated with this integration
        broker_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Broker Id
          description: The ID of the broker associated with this integration
      type: object
      title: IntegrationUpdateRequest
      examples:
      - collector_id: 10
        instance_name: Network-Mapper-HQ
        params:
          crawler_device_enrichment: true
          ip_list: 10.199.0.10, 10.199.0.2
          mapper_query_method: snmp
          mapper_snmp_credentials: '***'
          scope: all_nodes
          site_scope:
            enabled: false
    HTTPValidationError:
      properties:
        detail:
