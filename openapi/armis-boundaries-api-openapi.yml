openapi: 3.2.0
info:
  title: Armis API v3 Boundaries API
  version: 0.13.0
servers:
- url: https://api.armis.com/v3
tags:
- name: Boundaries
paths:
  /settings/boundaries:
    post:
      tags:
      - Boundaries
      summary: Create a boundary
      description: '### Required scopes:

        * `PERMISSION.SETTINGS.BOUNDARY.MANAGE.CREATE`'
      operationId: post_settings_boundaries_post
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoundaryCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersistentBoundary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Boundaries
      summary: List boundaries
      description: '### Required scopes:

        * `PERMISSION.SETTINGS.BOUNDARY.READ`'
      operationId: get_settings_boundaries_get
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: After
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersistentBoundaryItems'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /settings/boundaries/{boundary_id}:
    delete:
      tags:
      - Boundaries
      summary: Delete a boundary
      description: '### Required scopes:

        * `PERMISSION.SETTINGS.BOUNDARY.MANAGE.DELETE`'
      operationId: delete_settings_boundaries__boundary_id__delete
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: boundary_id
        in: path
        required: true
        schema:
          type: integer
          title: Boundary Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Boundaries
      summary: Get a boundary
      description: '### Required scopes:

        * `PERMISSION.SETTINGS.BOUNDARY.READ`'
      operationId: get_settings_boundaries__boundary_id__get
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: boundary_id
        in: path
        required: true
        schema:
          type: integer
          title: Boundary Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersistentBoundary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Boundaries
      summary: Update a boundary
      description: '### Required scopes:

        * `PERMISSION.SETTINGS.BOUNDARY.MANAGE.EDIT`'
      operationId: patch_settings_boundaries__boundary_id__patch
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: boundary_id
        in: path
        required: true
        schema:
          type: integer
          title: Boundary Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoundaryUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersistentBoundary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AsqRule:
      anyOf:
      - $ref: '#/components/schemas/AndRule'
      - $ref: '#/components/schemas/OrRule'
      title: AsqRule
      examples:
      - and:
        - category:Computers
        - model:Mac
      - or:
        - category:Computers
        - model:iPhone
      - and:
        - category:Computers
        - or:
          - category:Computers
          - model:iPhone
    PersistentBoundary:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        asq_rule:
          anyOf:
          - $ref: '#/components/schemas/AsqRule'
          - type: 'null'
        sites:
          items:
            $ref: '#/components/schemas/PersistentSite'
          type: array
          title: Sites
      type: object
      required:
      - id
      - name
      - asq_rule
      - sites
      title: PersistentBoundary
    BoundaryCreateRequest:
      properties:
        name:
          type: string
          title: Name
        asq_rule:
          anyOf:
          - $ref: '#/components/schemas/AsqRule'
          - type: 'null'
        site_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Site Ids
      type: object
      required:
      - name
      title: BoundaryCreateRequest
    BoundaryUpdateRequest:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        asq_rule:
          anyOf:
          - $ref: '#/components/schemas/AsqRule'
          - type: 'null'
        site_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Site Ids
      type: object
      title: BoundaryUpdateRequest
    OrRule:
      properties:
        and:
          items:
            anyOf:
            - type: string
            - type: object
              description: Another AsqRule
          type: array
          title: And
      type: object
      required:
      - or
      title: OrRule
    AndRule:
      properties:
        or:
          items:
            anyOf:
            - type: string
            - type: object
              description: Another AsqRule
          type: array
          title: Or
      type: object
      required:
      - and
      title: AndRule
    PersistentSite:
      properties:
        name:
          type: string
          title: Name
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
          description: The name of the location of the site, such as an address. When this field is set, the `lat` and `lng` are automatically derived from it.
          examples:
          - 548 Market Street Suite 97439 San Francisco, CA 94104-5401
        parent_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Parent Id
        tier:
          anyOf:
          - type: string
          - type: 'null'
          title: Tier
        asq_rule:
          anyOf:
          - $ref: '#/components/schemas/AsqRule'
          - type: 'null'
          description: Devices matching this ASQ rule will be associated with this site.
          examples:
          - and:
            - category:Computers
        asq_rule_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Asq Rule Description
        network_equipment_device_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Network Equipment Device Ids
          description: Devices that are detected through these network equipment devices will be associated with this site.
          examples:
          - - 1
            - 2
            - 3
        integration_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Integration Ids
          description: Devices that are detected through these integration will be associated with this site.
          examples:
          - - 4
            - 5
            - 6
        id:
          type: integer
          title: Id
        lat:
          anyOf:
          - type: number
          - type: 'null'
          title: Latitude
          description: The latitude coordinate of the physical location of the site on earth. This field is read-only and is automatically derived from the `location` field.
          examples:
          - 37.79
        lng:
          anyOf:
          - type: number
          - type: 'null'
          title: Longitude
          description: The longitude coordinate of the physical location of the site on earth. This field is read-only and is automatically derived from the `location` field.
          examples:
          - -122.4
      type: object
      required:
      - name
      - id
      title: PersistentSite
      examples:
      - asq_rule:
          and:
          - category:Computers
        id: 1
        integration_ids:
        - 4
        - 5
        - 6
        lat: 37.79
        lng: -122.4
        location: 548 Market Street Suite 97439 San Francisco, CA 94104-5401
        name: San Francisco HQ
        network_equipment_device_ids:
        - 1
        - 2
        - 3
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    PersistentBoundaryItems:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PersistentBoundary'
          type: array
          title: Items
        next:
          anyOf:
          - type: integer
          - type: 'null'
          title: Next
      type: object
      required:
      - items
      title: PersistentBoundaryItems
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-Armis-Client-Name
