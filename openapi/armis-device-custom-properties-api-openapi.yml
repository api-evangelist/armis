info:
  title: Armis API v3 Device Custom Properties API
  version: 0.13.0
servers:
- url: https://api.armis.com/v3
tags:
- name: Device Custom Properties
paths:
  /settings/device-custom-properties:
    post:
      tags:
      - Device Custom Properties
      summary: Create a new device custom property configuration
      description: '### Required scopes:

        * `PERMISSION.SETTINGS.CUSTOM_PROPERTIES.MANAGE`'
      operationId: post_settings_device_custom_properties_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Config'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersistentConfig'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
    get:
      tags:
      - Device Custom Properties
      summary: List all device custom property configurations
      description: '### Required scopes:

        * `PERMISSION.SETTINGS.CUSTOM_PROPERTIES.READ`'
      operationId: get_settings_device_custom_properties_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersistentConfigItems'
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
  /settings/device-custom-properties/{config_id}:
    delete:
      tags:
      - Device Custom Properties
      summary: Delete a device custom property configuration
      description: '### Required scopes:

        * `PERMISSION.SETTINGS.CUSTOM_PROPERTIES.MANAGE`'
      operationId: delete_settings_device_custom_properties__config_id__delete
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: config_id
        in: path
        required: true
        schema:
          type: integer
          title: Config Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Device Custom Properties
      summary: Get a device custom property configuration
      description: '### Required scopes:

        * `PERMISSION.SETTINGS.CUSTOM_PROPERTIES.READ`'
      operationId: get_settings_device_custom_properties__config_id__get
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: config_id
        in: path
        required: true
        schema:
          type: integer
          title: Config Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersistentConfig'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Device Custom Properties
      summary: Update a device custom property configuration
      description: '### Required scopes:

        * `PERMISSION.SETTINGS.CUSTOM_PROPERTIES.MANAGE`'
      operationId: patch_settings_device_custom_properties__config_id__patch
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: config_id
        in: path
        required: true
        schema:
          type: integer
          title: Config Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartialConfigRequest'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
