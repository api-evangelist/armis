              type: string
            type: array
          - type: 'null'
          title: Allowed Values
        id:
          type: integer
          title: Id
        created_by:
          type: string
          title: Created By
        creation_time:
          type: string
          format: date-time
          title: Creation Time
      type: object
      required:
      - name
      - type
      - id
      - created_by
      - creation_time
      title: PersistentConfig
      examples:
      - allowed_values:
        - Small
        - Medium
        - Large
        created_by: user@acme.com
        creation_time: '2025-06-16T00:00:00Z'
        description: The size of the device.
        id: 1
        name: Size
        type: enum
    Config:
