openapi: 3.2.0
info:
  title: Armis API v3 ARP API
  version: 0.13.0
servers:
- url: https://api.armis.com/v3
tags:
- name: ARP
paths:
  /arps:
    post:
      tags:
      - ARP
      summary: Upload a CSV of IP/MAC matches as user ARP records
      description: 'The records are accepted for processing and are not queryable yet when this endpoint responds.


        The file is validated as a whole: the first unusable line rejects the entire upload and no record is applied. If saving the records fails midway the upload may have been applied in part, in which case re-uploading the same file is safe and converges to the full result.


        ### Required scopes:

        * `PERMISSION.DEVICE.MANAGE`'
      operationId: post_arps_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArpUploadRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArpUploadResponse'
        '400':
          description: The file cannot be used. No record was applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArpUploadError'
        '413':
          description: The file must be at most 10485760 bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArpUploadError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '502':
          description: Failed to save the ARP records. The file was not applied in full; retry the upload.
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
components:
  schemas:
    ArpUploadResponse:
      properties:
        total_rows:
          type: integer
          title: Total Rows
          description: The number of data rows in the file. Blank rows are not counted.
        accepted_records:
          type: integer
          title: Accepted Records
          description: The number of ARP records that were sent for processing.
        duplicate_rows:
          type: integer
          title: Duplicate Rows
          description: The number of rows that repeated an earlier IP/MAC match and were skipped.
        expiration:
          type: string
          format: date-time
          title: Expiration
          description: The UTC time at which the uploaded records expire.
      type: object
      required:
      - total_rows
      - accepted_records
      - duplicate_rows
      - expiration
      title: ArpUploadResponse
      description: A summary of an accepted ARP records upload.
    ArpUploadRequest:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: A CSV file with the columns ip,mac.
        expiration:
          type: string
          format: date-time
          title: Expiration
          description: The UTC time at which the uploaded records expire. Must be in the future and at most 30 days from now.
          examples:
          - '2026-12-31T00:00:00Z'
        network_id:
          type: string
          minLength: 1
          title: Network Id
          description: Identifies the logical network segment the ARP data originates from. Used to disambiguate overlapping IP ranges across different network segments. When multiple networks share the same IP space, this field ensures MAC-to-IP bindings are resolved within the correct network context.
          examples:
          - L_621732956900298999
      type: object
      required:
      - file
      - expiration
      - network_id
      title: ArpUploadRequest
      description: A CSV of IP/MAC matches to upload as user ARP records.
    ArpUploadError:
      properties:
        message:
          type: string
          title: Message
          description: A description of the problem.
        line:
          anyOf:
          - type: integer
          - type: 'null'
          title: Line
          description: The number of the line in the file that was rejected.
        column:
          anyOf:
          - type: string
          - type: 'null'
          title: Column
          description: The name of the column that was rejected.
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
          description: The value that was rejected.
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: A description of the problem with the value.
      type: object
      required:
      - message
      title: ArpUploadError
      description: 'The reason an ARP records upload was rejected.


        The upload is rejected as a whole, so none of the records in the file were applied. Only problems

        that are specific to a single line carry `line`, `column`, `value` and `error`.'
      examples:
      - message: The file must have a header row with the columns "ip" and "mac".
      - column: ip
        error: IPv6 addresses are not supported; only IPv4.
        line: 4
        message: Invalid ARP record.
        value: 2001:db8::1
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-Armis-Client-Name
