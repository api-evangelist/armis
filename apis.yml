aid: armis
name: Armis
description: Armis is a cyber exposure management and asset intelligence company. Its Armis Centrix platform
  discovers, protects, and manages every physical and virtual asset in an enterprise environment — IT,
  OT, ICS, IoT, IoMT, medical devices, cloud workloads, and applications — giving security teams real-time
  visibility, risk prioritization, and threat detection across the full attack surface. Armis exposes
  this intelligence through a tenant-scoped REST API secured with OAuth2 client-credentials, an official
  Python SDK (armis-sdk), a Go application-security scanning CLI (armis-cli), and two published Model
  Context Protocol servers (armis-knowledge-mcp and armis-appsec-mcp) for agent-native AppSec workflows.
  The company was surfaced as a portfolio company of General Catalyst and Insight Partners and enriched
  by the API Evangelist pipeline from its public developer surface.
